spring:
  application:
    name: cineverse
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cineverse}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:cineverse}
    password: ${DB_PASSWORD:cineverse}
  jpa:
    hibernate:
      ddl-auto: none        # o schema é gerenciado pelo Flyway
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # Upstash e outros Redis gerenciados exigem TLS
  cache:
    type: redis

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-caracteres!!}
    access-expiration-ms: 900000        # 15 min
    refresh-expiration-days: 30
  tmdb:
    api-key: ${TMDB_API_KEY:}           # crie grátis em https://www.themoviedb.org/settings/api
    base-url: https://api.themoviedb.org/3
    image-base: https://image.tmdb.org/t/p

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

logging:
  level:
    com.cineverse: INFO
