spring:
  application:
    name: cineverse
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cineverse}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:cineverse}
    password: ${DB_PASSWORD:cineverse}
  jpa:
    hibernate:
      ddl-auto: none        # o schema é gerenciado pelo Flyway
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true   # Supabase já tem objetos no schema public; cria baseline e aplica as migrations
    baseline-version: 0         # baseline em 0 para que V1 (versão 1) também seja executada
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # Upstash e outros Redis gerenciados exigem TLS
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}          # seu endereço Gmail completo
    password: ${MAIL_PASSWORD:}          # "senha de app" do Gmail (16 letras), NÃO a senha normal
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Timeouts (ms): sem isto, um SMTP lento/travado pendura a requisição (60s+ / 502).
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

server:
  port: ${PORT:8080}   # Render injeta a porta em PORT; local usa 8080

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-caracteres!!}
    access-expiration-ms: 900000        # 15 min
    refresh-expiration-days: 30
  # Base do frontend. Aceita LISTA separada por vírgula (para liberar CORS de Render E Vercel).
  # O 1º item da lista é o usado para montar o link do e-mail de redefinição de senha.
  # Local: http://localhost:4200 | Produção: https://cineverse-one-hazel.vercel.app
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  password-reset:
    from: ${MAIL_FROM:CineVerse <no-reply@cineverse.app>}
    expiration-minutes: 30
  tmdb:
    api-key: ${TMDB_API_KEY:}           # crie grátis em https://www.themoviedb.org/settings/api
    base-url: https://api.themoviedb.org/3
    image-base: https://image.tmdb.org/t/p

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  health:
    # Não deixar /actuator/health ficar DOWN por causa de serviço externo:
    # isso derrubaria o deploy no Render e faria o keep-alive (UptimeRobot) achar que caiu.
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.cineverse: INFO
