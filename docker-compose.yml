# Stack completa: docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cineverse
      POSTGRES_USER: cineverse
      POSTGRES_PASSWORD: cineverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-min-32-caracteres!!}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
